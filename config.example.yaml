# Copy to config.yaml and edit. config.yaml is gitignored (may hold model choices / paths).

# Which LLM backend drives the translation and extraction passes.
#   claude_code -> file handoff, no API key, no billing (default)
#   anthropic   -> direct API calls for unattended / CI runs (needs ANTHROPIC_API_KEY)
backend: claude_code

anthropic:
  # Model id for the anthropic backend. Use the latest capable Claude model.
  model: claude-opus-4-8
  max_tokens: 8000
  # The key is read from the ANTHROPIC_API_KEY environment variable, never from this file.

claude_code:
  # Where prompt/response handoff files are written for the claude_code backend.
  # May be an ABSOLUTE path to keep assembled prompts out of the repo checkout (useful when a
  # workspace lives in an external content root, below; relative paths resolve under the repo).
  runs_dir: .runs

# How much preceding context to retrieve before translating a chapter.
retrieval:
  previous_chapters: 2   # include the N previously translated chapters as context

# Where workspaces (novels / document sets) are searched for, in priority order. Each entry is a
# directory that contains one subdirectory per workspace. Relative paths resolve against the repo
# root; absolute paths let a workspace live in an independently managed directory outside the repo.
# Default when unset: the bundled ./novels. The WENMAI_CONTENT_ROOTS environment variable
# (os.pathsep-separated) overrides this list for a single run.
# content_roots:
#   - novels
#   - /abs/path/to/an/external/workspace-root

# What to do when the same workspace name exists under more than one content root:
#   error  (default) -> fail and name the roots, so nothing is silently shadowed
#   first            -> use the first matching root and emit a warning
# content_roots_on_conflict: error
